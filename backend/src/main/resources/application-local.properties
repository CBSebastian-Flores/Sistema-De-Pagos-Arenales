# CONEXION A BASE DE DATOS LOCAL - SQL SERVER
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CC_Arenales;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNA,E_SQL}
spring.datasource.password=${DB_PASSWORD_SQL}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / HIBERNATE PARA SQL SERVER
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect